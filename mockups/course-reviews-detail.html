<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kurs-Bewertungen · Detailseite · Kursverwaltung</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen antialiased">

  <!-- ===== Header ===== -->
  <header class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-gray-200">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="marketplace.html" class="flex items-center gap-2">
        <span class="grid place-items-center w-8 h-8 rounded-lg bg-violet-600 text-white font-bold">K</span>
        <span class="text-lg font-bold tracking-tight">Kursverwaltung</span>
      </a>
      <nav class="hidden md:flex items-center gap-7 text-sm font-medium text-gray-600">
        <a href="marketplace.html" class="text-violet-700 font-semibold">Kurse</a>
        <a href="my-courses.html" class="hover:text-gray-900">Meine Kurse</a>
        <a href="#" class="hover:text-gray-900">Verwaltung</a>
      </nav>
      <span class="grid place-items-center w-9 h-9 rounded-full bg-violet-100 text-violet-700 text-sm font-semibold">HT</span>
    </div>
  </header>

  <!-- ===== Kopf: Titel + ⭐-Durchschnitt ===== -->
  <section class="bg-violet-50/60 border-b border-gray-200">
    <div class="max-w-6xl mx-auto px-6 py-10">
      <nav class="text-sm text-gray-500 mb-6 flex items-center gap-2">
        <a href="marketplace.html" class="hover:text-gray-900">Kurse</a>
        <span>/</span>
        <span class="text-violet-700">Entwicklung</span>
      </nav>
      <p class="text-xs font-semibold uppercase tracking-wide text-violet-700 mb-3">Entwicklung</p>
      <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-gray-900 leading-tight">
        Claude Code im Projektalltag
      </h1>
      <!-- ⭐-Durchschnitt + Anzahl (nur öffentliche Bewertungen) -->
      <div class="mt-4 flex flex-wrap items-center gap-x-5 gap-y-2 text-sm text-gray-600">
        <span class="inline-flex items-center gap-1.5">
          <span class="flex items-center gap-0.5 text-amber-400">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.36 4.18a1 1 0 00.95.69h4.4c.97 0 1.37 1.24.59 1.81l-3.56 2.59a1 1 0 00-.36 1.12l1.36 4.18c.3.92-.76 1.69-1.54 1.12l-3.56-2.59a1 1 0 00-1.18 0L6.25 18.6c-.78.57-1.84-.2-1.54-1.12l1.36-4.18a1 1 0 00-.36-1.12L2.15 9.6c-.78-.57-.38-1.81.59-1.81h4.4a1 1 0 00.95-.69z"/></svg>

            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.36 4.18a1 1 0 00.95.69h4.4c.97 0 1.37 1.24.59 1.81l-3.56 2.59a1 1 0 00-.36 1.12l1.36 4.18c.3.92-.76 1.69-1.54 1.12l-3.56-2.59a1 1 0 00-1.18 0L6.25 18.6c-.78.57-1.84-.2-1.54-1.12l1.36-4.18a1 1 0 00-.36-1.12L2.15 9.6c-.78-.57-.38-1.81.59-1.81h4.4a1 1 0 00.95-.69z"/></svg>
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.36 4.18a1 1 0 00.95.69h4.4c.97 0 1.37 1.24.59 1.81l-3.56 2.59a1 1 0 00-.36 1.12l1.36 4.18c.3.92-.76 1.69-1.54 1.12l-3.56-2.59a1 1 0 00-1.18 0L6.25 18.6c-.78.57-1.84-.2-1.54-1.12l1.36-4.18a1 1 0 00-.36-1.12L2.15 9.6c-.78-.57-.38-1.81.59-1.81h4.4a1 1 0 00.95-.69z"/></svg>
            <svg class="w-5 h-5 text-gray-300" fill="currentColor" viewBox="0 0 20 20"><path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.36 4.18a1 1 0 00.95.69h4.4c.97 0 1.37 1.24.59 1.81l-3.56 2.59a1 1 0 00-.36 1.12l1.36 4.18c.3.92-.76 1.69-1.54 1.12l-3.56-2.59a1 1 0 00-1.18 0L6.25 18.6c-.78.57-1.84-.2-1.54-1.12l1.36-4.18a1 1 0 00-.36-1.12L2.15 9.6c-.78-.57-.38-1.81.59-1.81h4.4a1 1 0 00.95-.69z"/></svg>
          </span>
          <span class="font-semibold text-gray-900">4,7</span>
          <span class="text-gray-500">· 3 Bewertungen</span>
        </span>
      </div>
    </div>
  </section>

  <!-- ===== Bewertungs-Sektion (ersetzt die hartkodierten Testimonials) ===== -->
  <main class="max-w-6xl mx-auto px-6 py-12">
    <section class="max-w-3xl">
      <div class="flex items-center justify-between mb-5">
        <h2 class="text-xl font-bold tracking-tight text-gray-900">Was Teilnehmer sagen</h2>
        <!-- Nur für eingeloggte Nutzer:innen, die noch nicht bewertet haben -->
        <button onclick="document.getElementById('review-modal').showModal()"
                class="rounded-lg bg-violet-600 px-4 py-2 text-sm text-white font-medium hover:bg-violet-700">
          Kurs bewerten
        </button>
        <!-- Alternativ (schon bewertet): <span class="text-sm text-gray-500">Du hast diesen Kurs bereits bewertet</span> -->
      </div>

      <!-- Liste sichtbarer Bewertungen (anonyme als „Anonym") -->
      <div class="space-y-4">
        <figure class="rounded-xl border border-gray-200 bg-white p-5">
          <div class="flex items-center justify-between mb-2">
            <figcaption class="text-sm font-semibold text-gray-900">Lena Lernerin</figcaption>
            <div class="flex items-center gap-0.5 text-amber-400">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.36 4.18a1 1 0 00.95.69h4.4c.97 0 1.37 1.24.59 1.81l-3.56 2.59a1 1 0 00-.36 1.12l1.36 4.18c.3.92-.76 1.69-1.54 1.12l-3.56-2.59a1 1 0 00-1.18 0L6.25 18.6c-.78.57-1.84-.2-1.54-1.12l1.36-4.18a1 1 0 00-.36-1.12L2.15 9.6c-.78-.57-.38-1.81.59-1.81h4.4a1 1 0 00.95-.69z"/></svg>
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.36 4.18a1 1 0 00.95.69h4.4c.97 0 1.37 1.24.59 1.81l-3.56 2.59a1 1 0 00-.36 1.12l1.36 4.18c.3.92-.76 1.69-1.54 1.12l-3.56-2.59a1 1 0 00-1.18 0L6.25 18.6c-.78.57-1.84-.2-1.54-1.12l1.36-4.18a1 1 0 00-.36-1.12L2.15 9.6c-.78-.57-.38-1.81.59-1.81h4.4a1 1 0 00.95-.69z"/></svg>
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.36 4.18a1 1 0 00.95.69h4.4c.97 0 1.37 1.24.59 1.81l-3.56 2.59a1 1 0 00-.36 1.12l1.36 4.18c.3.92-.76 1.69-1.54 1.12l-3.56-2.59a1 1 0 00-1.18 0L6.25 18.6c-.78.57-1.84-.2-1.54-1.12l1.36-4.18a1 1 0 00-.36-1.12L2.15 9.6c-.78-.57-.38-1.81.59-1.81h4.4a1 1 0 00.95-.69z"/></svg>
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.36 4.18a1 1 0 00.95.69h4.4c.97 0 1.37 1.24.59 1.81l-3.56 2.59a1 1 0 00-.36 1.12l1.36 4.18c.3.92-.76 1.69-1.54 1.12l-3.56-2.59a1 1 0 00-1.18 0L6.25 18.6c-.78.57-1.84-.2-1.54-1.12l1.36-4.18a1 1 0 00-.36-1.12L2.15 9.6c-.78-.57-.38-1.81.59-1.81h4.4a1 1 0 00.95-.69z"/></svg>
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.36 4.18a1 1 0 00.95.69h4.4c.97 0 1.37 1.24.59 1.81l-3.56 2.59a1 1 0 00-.36 1.12l1.36 4.18c.3.92-.76 1.69-1.54 1.12l-3.56-2.59a1 1 0 00-1.18 0L6.25 18.6c-.78.57-1.84-.2-1.54-1.12l1.36-4.18a1 1 0 00-.36-1.12L2.15 9.6c-.78-.57-.38-1.81.59-1.81h4.4a1 1 0 00.95-.69z"/></svg>
            </div>
          </div>
          <blockquote class="text-sm text-gray-700">„Jeden Euro wert — endlich verstehe ich, wie ich KI im Alltag einsetze."</blockquote>
        </figure>

        <figure class="rounded-xl border border-gray-200 bg-white p-5">
          <div class="flex items-center justify-between mb-2">
            <figcaption class="text-sm font-semibold text-gray-500 italic">Anonym</figcaption>
            <div class="flex items-center gap-0.5 text-amber-400">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.36 4.18a1 1 0 00.95.69h4.4c.97 0 1.37 1.24.59 1.81l-3.56 2.59a1 1 0 00-.36 1.12l1.36 4.18c.3.92-.76 1.69-1.54 1.12l-3.56-2.59a1 1 0 00-1.18 0L6.25 18.6c-.78.57-1.84-.2-1.54-1.12l1.36-4.18a1 1 0 00-.36-1.12L2.15 9.6c-.78-.57-.38-1.81.59-1.81h4.4a1 1 0 00.95-.69z"/></svg>
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.36 4.18a1 1 0 00.95.69h4.4c.97 0 1.37 1.24.59 1.81l-3.56 2.59a1 1 0 00-.36 1.12l1.36 4.18c.3.92-.76 1.69-1.54 1.12l-3.56-2.59a1 1 0 00-1.18 0L6.25 18.6c-.78.57-1.84-.2-1.54-1.12l1.36-4.18a1 1 0 00-.36-1.12L2.15 9.6c-.78-.57-.38-1.81.59-1.81h4.4a1 1 0 00.95-.69z"/></svg>
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.36 4.18a1 1 0 00.95.69h4.4c.97 0 1.37 1.24.59 1.81l-3.56 2.59a1 1 0 00-.36 1.12l1.36 4.18c.3.92-.76 1.69-1.54 1.12l-3.56-2.59a1 1 0 00-1.18 0L6.25 18.6c-.78.57-1.84-.2-1.54-1.12l1.36-4.18a1 1 0 00-.36-1.12L2.15 9.6c-.78-.57-.38-1.81.59-1.81h4.4a1 1 0 00.95-.69z"/></svg>
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.36 4.18a1 1 0 00.95.69h4.4c.97 0 1.37 1.24.59 1.81l-3.56 2.59a1 1 0 00-.36 1.12l1.36 4.18c.3.92-.76 1.69-1.54 1.12l-3.56-2.59a1 1 0 00-1.18 0L6.25 18.6c-.78.57-1.84-.2-1.54-1.12l1.36-4.18a1 1 0 00-.36-1.12L2.15 9.6c-.78-.57-.38-1.81.59-1.81h4.4a1 1 0 00.95-.69z"/></svg>
              <svg class="w-4 h-4 text-gray-300" fill="currentColor" viewBox="0 0 20 20"><path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.36 4.18a1 1 0 00.95.69h4.4c.97 0 1.37 1.24.59 1.81l-3.56 2.59a1 1 0 00-.36 1.12l1.36 4.18c.3.92-.76 1.69-1.54 1.12l-3.56-2.59a1 1 0 00-1.18 0L6.25 18.6c-.78.57-1.84-.2-1.54-1.12l1.36-4.18a1 1 0 00-.36-1.12L2.15 9.6c-.78-.57-.38-1.81.59-1.81h4.4a1 1 0 00.95-.69z"/></svg>
            </div>
          </div>
          <blockquote class="text-sm text-gray-700">„Klar strukturiert und praxisnah. Die Beispiele kann ich sofort nutzen."</blockquote>
        </figure>
      </div>

      <!-- Leerzustand (wenn keine sichtbaren Bewertungen): -->
      <!--
      <div class="rounded-xl border border-dashed border-gray-300 bg-white p-8 text-center text-sm text-gray-500">
        Noch keine Bewertungen — sei die:der Erste.
      </div>
      -->
    </section>
  </main>

  <!-- ===== Bewertungs-Modal (Stimulus + <dialog>) ===== -->
  <dialog id="review-modal" class="rounded-2xl p-0 w-full max-w-md backdrop:bg-gray-900/40">
    <form method="dialog" class="p-6">
      <h3 class="text-lg font-bold tracking-tight text-gray-900">End-of-Term Review</h3>
      <p class="mt-1 text-sm text-gray-600">Vielen Dank für deine Teilnahme! Bitte bewerte diesen Kurs.</p>

      <!-- Sterne-Eingabe (Stimulus rating-controller setzt das hidden field) — über die volle Breite verteilt -->
      <div class="mt-5 flex items-center justify-between w-full text-4xl text-gray-300">
        <button type="button" class="hover:text-amber-400">★</button>
        <button type="button" class="hover:text-amber-400">★</button>
        <button type="button" class="hover:text-amber-400">★</button>
        <button type="button" class="hover:text-amber-400">★</button>
        <button type="button" class="hover:text-amber-400">★</button>
      </div>

      <textarea rows="3" placeholder="Deine ehrliche Meinung mit anderen Teilnehmern (optional)"
        class="mt-5 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-700 placeholder-gray-400 focus:border-violet-600 focus:ring-violet-600"></textarea>

      <div class="mt-4 space-y-2.5">
        <label class="flex items-center gap-2 text-sm text-gray-700">
          <input type="checkbox" class="rounded border-gray-300 text-violet-600 focus:ring-violet-600">
          Ich möchte anonym bewerten
        </label>
        <label class="flex items-center gap-2 text-sm text-gray-700">
          <input type="checkbox" checked class="rounded border-gray-300 text-violet-600 focus:ring-violet-600">
          Meine Bewertung öffentlich anzeigen
        </label>
      </div>

      <div class="mt-6 flex items-center gap-3">
        <button class="rounded-lg bg-violet-600 px-4 py-2 text-sm text-white font-medium hover:bg-violet-700">
          Bewertung absenden
        </button>
        <button value="cancel" class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">
          Vielleicht später
        </button>
      </div>
    </form>
  </dialog>

  <p class="text-center text-xs text-gray-400 pb-10">
    Mockup — <a href="course-reviews-admin.html" class="text-violet-700 hover:underline">Admin-Moderation ansehen</a>
  </p>

</body>
</html>
